; RobRunAIO.exe settings. Delete this file to use the built-in defaults.
;
; The overlay is started only after ROB RUN.exe is running AND the launcher
; decides the game has reached its main menu. After that it is supervised, so a
; match that does not attach does not sit on "Waiting for game" indefinitely.

[launcher]

; 1 = wait until the game owns a visible top-level window before the delay
;     starts; 0 = start the delay as soon as the process is detected.
menu_wait_window=1

; Extra seconds to wait after that point, so the main menu can finish loading.
; Raise this if the overlay appears while the game is still on a loading
; screen; lower it if the launcher idles after the menu is already up.
menu_delay=5

; Seconds the overlay gets to report game data (status.log with players) after
; it starts. In a match with no data after this, the overlay is restarted.
attach_timeout=120

; How many times the overlay may be restarted before the launcher gives up and
; leaves the last instance running. The stale runtime cache is moved aside on
; each restart so discovery starts from a clean scan.
reattach_attempts=3

; 1 = hide the launcher through the driver. Off, because the process-list
; unlink is cross-checked by PatchGuard on this build and bugchecks 0x109.
hide_launcher=0

; 1 = every launch copies the launcher and the overlay to a random benign name
; (dllhost, RuntimeBroker, ...), so Task Manager never shows RobRunAIO.exe or
; RobRunPort.exe. This is the crash-free replacement for process hiding.
masquerade=1

