; kd2.exe switches. This file is copied into the launcher payload folder.
;
; cleanup=1 keeps the mapper's kernel trace cleanup (PiDDB cache, hash bucket
; list, MmUnloadedDrivers entry, WdFilter list). cleanup=0 skips it so the
; mapping can be tested without any kernel-structure edits.
;
; Change this only for a test run; 1 is the normal setting.

cleanup=1
